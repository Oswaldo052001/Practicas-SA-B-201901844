# Practica 10 - Software Avanzado - USAC, carne 201901844
# Pipeline de las 3 imagenes INSTRUMENTADAS con OpenTelemetry (api-gateway,
# auth-service, reserva-service; codigo en P10/src). Los otros 4 servicios no
# cambian y siguen usando las imagenes de la Practica 8 (p8-v1.0.7).
#
# Se conserva integro el flujo de la Practica 8: CI (build+test), build y push
# a GHCR, escaneo con Trivy (bloquea CVEs CRITICAL), SBOM CycloneDX y firma
# keyless con Cosign. La diferencia es el disparador, un tag "p10-vX.Y.Z".
#
# Las imagenes se publican bajo el MISMO nombre de paquete de la P8
# (ghcr.io/<owner>/sa-p8/<servicio>), solo con otra tag: asi heredan la
# visibilidad publica que ya tienen esos paquetes y el cluster las puede
# bajar sin imagePullSecret (un paquete nuevo en GHCR nace privado).
#
# NO despliega nada: el cluster solo cambia cuando la nueva tag se escribe en
# el repo GitOps (apps/sa-platform/values-p10.yaml) y ArgoCD la sincroniza.

name: P10 - CI/CD servicios instrumentados

on:
  push:
    branches: ["**"]
    paths:
      - "P10/src/**"
      - "P10/docker/**"
      - ".github/workflows/p10-cicd.yml"
    tags: ["p10-v*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: Build y test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, reserva-service]
    defaults:
      run:
        working-directory: P10/src/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: P10/src/${{ matrix.service }}/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Pruebas automatizadas (jest)
        run: npm test

  docker-build-push:
    name: Docker build/push (${{ matrix.service }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/p10-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # requerido por Cosign para firma keyless (OIDC)
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, reserva-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombre de la imagen (owner en minusculas, paquete sa-p8 de la P8)
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sa-p8/${{ matrix.service }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push de ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: P10
          file: P10/docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=p10-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=p10-${{ matrix.service }}

      - name: Escaneo de vulnerabilidades con Trivy (bloquea si hay CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Generar SBOM (CycloneDX) con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json

      - name: Publicar SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Firmar la imagen con Cosign (keyless, identidad OIDC de GitHub Actions)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ steps.meta.outputs.image }}
