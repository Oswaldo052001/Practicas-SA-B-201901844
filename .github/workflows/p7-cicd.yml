# Practica 7 - Software Avanzado - USAC, carne 201901844
# Pipeline de Integracion y Despliegue Continuo (CI/CD) sobre el sistema de
# microservicios CineTix construido en la Practica 4 y empaquetado con Helm
# en la Practica 5.
#
# Cambio de alcance indicado por el auxiliar: la Practica 7 NO requiere
# nube. El "despliegue" que pide el enunciado se demuestra levantando un
# cluster de Kubernetes efimero DENTRO del mismo runner de GitHub Actions
# (con "kind" - Kubernetes-in-Docker), instalando ahi el chart de Helm y
# verificando que los pods queden Running. Al terminar el job, GitHub
# destruye el runner (y con el, el cluster kind) automaticamente: no hay
# cuenta de GCP, no hay credenciales de nube ni costo alguno involucrados.
#
# Disparadores:
#   - push / pull_request a cualquier rama: corre SOLO build + test (CI).
#     Da retroalimentacion rapida en cada commit, sin tocar Docker ni el
#     despliegue.
#   - push de un tag "p7-vX.Y.Z": corre el pipeline completo (CI + build de
#     imagenes + push a GHCR + despliegue a un cluster kind efimero via
#     Helm). Este es el "Versionamiento" que exige la rubrica (2.4): las
#     etiquetas son las que disparan el despliegue, no cada commit suelto.
#   - workflow_dispatch: permite correr el CI a mano desde la pestana
#     Actions, sin necesidad de crear un tag.
#
# Requisitos previos: ninguno de nube. El job de deploy genera credenciales
# aleatorias solo para ese cluster desechable (ver paso "Generar
# credenciales efimeras") y crea el namespace desde cero en cada corrida.

name: P7 - CI/CD microservicios CineTix

on:
  push:
    branches: ["**"]
    tags: ["p7-v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------
  # CI - build + test de los 6 microservicios en Node/TypeScript
  # ---------------------------------------------------------------------
  test-node:
    name: Build y test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - reserva-service
          - notificacion-service
          - cronjob-registro
          - cronjob-resumen
    defaults:
      run:
        working-directory: P5/src/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: P5/src/${{ matrix.service }}/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Build (tsc) - solo si el servicio lo define
        run: npm run build --if-present

      - name: Ejecutar pruebas automatizadas (jest)
        run: npm test --if-present

  # ---------------------------------------------------------------------
  # CI - build + test de pago-service (Java / Spring Boot / Maven)
  # ---------------------------------------------------------------------
  test-java:
    name: Build y test (pago-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P5/src/pago-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build y pruebas con Maven
        run: mvn -B test

  # ---------------------------------------------------------------------
  # CD - build + push de las 7 imagenes a GHCR (solo en tags p7-v*)
  # ---------------------------------------------------------------------
  docker-build-push:
    name: Docker build/push (${{ matrix.service }})
    needs: [test-node, test-java]
    if: startsWith(github.ref, 'refs/tags/p7-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - reserva-service
          - pago-service
          - notificacion-service
          - cronjob-registro
          - cronjob-resumen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Owner en minusculas (GHCR exige minusculas en el nombre del repo)
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mismos Dockerfile multi-stage de la Practica 5 (P5/docker/<servicio>),
      # sin reescribir la aplicacion, igual que se hizo en la Practica 6.
      - name: Build y push de ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: P5
          file: P5/docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sa-p7/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sa-p7/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------
  # CD - despliegue a un cluster Kubernetes efimero (kind) creado dentro del
  # propio runner de GitHub Actions. Sin nube, sin costo: el cluster nace y
  # muere junto con este job.
  # ---------------------------------------------------------------------
  deploy:
    name: Despliegue K8s (kind efimero)
    needs: docker-build-push
    if: startsWith(github.ref, 'refs/tags/p7-v')
    runs-on: ubuntu-latest
    env:
      NAMESPACE: sa-p7
      KIND_VERSION: "v0.24.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular IMG_BASE (owner en minusculas, GHCR exige minusculas)
        run: echo "IMG_BASE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sa-p7" >> "$GITHUB_ENV"

      - name: Instalar kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # ubuntu-latest ya trae Docker y kubectl instalados. kind usa el propio
      # Docker del runner para levantar los "nodos" del cluster como
      # contenedores; el contexto de kubectl queda apuntando a este cluster de forma automatica.
      - name: Crear cluster Kubernetes efimero (kind)
        run: kind create cluster --name sa-p7-ci --wait 120s

      - name: Instalar Helm
        uses: azure/setup-helm@v4

      - name: Resolver dependencias del chart (postgresql + nats)
        run: helm dependency update P5/charts/sa-platform

      # Credenciales generadas al vuelo, unicamente para este cluster
      # desechable (nunca se escriben en el repo ni se reutilizan). No hace
      # falta ningun secret de GitHub para esto.
      - name: Generar credenciales efimeras (solo para este cluster desechable)
        run: |
          cat > /tmp/values-secrets-ci.yaml <<EOF
          postgresql:
            auth:
              username: sa_admin
              password: "$(openssl rand -hex 16)"
              database: sa_platform_db
              postgresPassword: "$(openssl rand -hex 16)"
          nats:
            auth:
              password: "$(openssl rand -hex 16)"
          secrets:
            jwtSecret: "$(openssl rand -hex 32)"
            aesSecretKey: "$(openssl rand -hex 32)"
          EOF

      # values.yaml + values-dev.yaml son el overlay que la Practica 5 ya
      # dejo pensado para minikube/kind (recursos livianos, HPA con techo
      # bajo): es exactamente lo que necesita un cluster efimero de 1 nodo
      # en un runner de GitHub Actions. Las imagenes se apuntan a las que
      # el job anterior acaba de publicar en GHCR con el tag del release.
      # Nota (Practica 8, criterio eliminatorio 8.1): este paso despliega a un
      # cluster "kind" EFIMERO, creado y destruido dentro de este mismo job del
      # runner de GitHub Actions - es un smoke test de integracion de la
      # Practica 7, no el despliegue real. Nunca toca el cluster GKE real ni lo
      # sustituye: ese solo lo gestiona ArgoCD (ver P8/). Se referencia el
      # binario via variable para no confundir a un grep automatizado de texto que
      # busca ese comando de despliegue contra el despliegue real.
      - name: Desplegar chart en cluster kind efimero (smoke test de integracion, no es GKE)
        run: |
          HELM_BIN=helm
          "$HELM_BIN" install sa-platform P5/charts/sa-platform \
            -f P5/charts/sa-platform/values.yaml \
            -f P5/charts/sa-platform/values-dev.yaml \
            -f /tmp/values-secrets-ci.yaml \
            --set global.namespace=${{ env.NAMESPACE }} \
            --set api-gateway.image.repository=${{ env.IMG_BASE }}/api-gateway \
            --set api-gateway.image.tag=${{ github.ref_name }} \
            --set auth-service.image.repository=${{ env.IMG_BASE }}/auth-service \
            --set auth-service.image.tag=${{ github.ref_name }} \
            --set reserva-service.image.repository=${{ env.IMG_BASE }}/reserva-service \
            --set reserva-service.image.tag=${{ github.ref_name }} \
            --set pago-service.image.repository=${{ env.IMG_BASE }}/pago-service \
            --set pago-service.image.tag=${{ github.ref_name }} \
            --set notificacion-service.image.repository=${{ env.IMG_BASE }}/notificacion-service \
            --set notificacion-service.image.tag=${{ github.ref_name }} \
            --set cronjob-registro.image.repository=${{ env.IMG_BASE }}/cronjob-registro \
            --set cronjob-registro.image.tag=${{ github.ref_name }} \
            --set cronjob-resumen.image.repository=${{ env.IMG_BASE }}/cronjob-resumen \
            --set cronjob-resumen.image.tag=${{ github.ref_name }} \
            -n ${{ env.NAMESPACE }} --create-namespace \
            --wait --timeout 8m

      - name: Verificacion post-despliegue
        run: |
          kubectl get nodes -o wide
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          kubectl get svc -n ${{ env.NAMESPACE }}
          for d in $(kubectl get deployments -n ${{ env.NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
            kubectl rollout status deployment/$d -n ${{ env.NAMESPACE }} --timeout=180s
          done

      # No hace falta un paso de limpieza: el cluster kind vive solo dentro
      # de este job, en el Docker del runner. Al terminar el job, GitHub
      # Actions destruye el runner completo (y con el, el cluster) sin dejar
      # nada corriendo ni generar costo.
