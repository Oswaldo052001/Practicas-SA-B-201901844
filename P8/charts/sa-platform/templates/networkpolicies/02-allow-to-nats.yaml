apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sa-p5-allow-to-nats
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  # Practica 6: el gateway ya no habla HTTP directo con los pods de los
  # microservicios (la policy "allow-gateway-to-microservices" de la
  # Practica 5 quedo obsoleta y se elimino). Toda la comunicacion
  # gateway<->microservicios<->cronjobs pasa ahora por NATS, asi que la
  # unica regla de red que hace falta es permitir que esos tres roles
  # alcancen al pod de NATS.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: sa.usac.edu/role
                operator: In
                values: ["gateway", "microservicio", "cronjob"]
      ports:
        - protocol: TCP
          port: 4222
