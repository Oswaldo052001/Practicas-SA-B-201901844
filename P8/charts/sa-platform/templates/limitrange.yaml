{{- if .Values.manageNamespace }}
apiVersion: v1
kind: LimitRange
metadata:
  name: sa-p5-limits
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu | default "100m" | quote }}
        memory: {{ .Values.limitRange.defaultRequestMemory | default "128Mi" | quote }}
      default:
        cpu: {{ .Values.limitRange.defaultLimitCpu | default "300m" | quote }}
        memory: {{ .Values.limitRange.defaultLimitMemory | default "256Mi" | quote }}
{{- end }}
