# ---------------------------------------------------------------------------
# cronjob-registro: cada 2 minutos inserta fecha GMT-6 + carne
# ---------------------------------------------------------------------------
cronjob-registro:
  image:
    repository: sa-p5/cronjob-registro
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 150m, memory: 128Mi }
  serviceAccount:
    create: true
  env:
    dbName: cronjobs_db
    carneEstudiante: "201901844"
    timezone: "America/Guatemala"

# ---------------------------------------------------------------------------
# cronjob-resumen: cada 10 minutos calcula resumen y publica en NATS JetStream
# ---------------------------------------------------------------------------
cronjob-resumen:
  image:
    repository: sa-p5/cronjob-resumen
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 150m, memory: 128Mi }
  serviceAccount:
    create: true
  env:
    dbName: cronjobs_db

# ---------------------------------------------------------------------------
# Namespace-level: ResourceQuota y LimitRange
# ---------------------------------------------------------------------------
resourceQuota:
  requestsCpu: "3"
  requestsMemory: 3Gi
  limitsCpu: "6"
  limitsMemory: 6Gi
  pods: "40"

limitRange:
  defaultRequestCpu: 100m
  defaultRequestMemory: 128Mi
  defaultLimitCpu: 300m
  defaultLimitMemory: 256Mi
