apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-resumen
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "cronjob-resumen.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "cronjob-resumen.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "cronjob-resumen.serviceAccountName" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: cronjob-resumen
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: sa-p5-shared-config
                - configMapRef:
                    name: cronjob-resumen-config
                - secretRef:
                    name: {{ include "sa-platform.postgresqlSecretName" . }}
                - secretRef:
                    name: {{ include "sa-platform.natsSecretName" . }}
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.postgresqlSecretName" . }}
                      key: password
                - name: NATS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.natsSecretName" . }}
                      key: nats-password
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
