apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-nats
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "nats.labels" . | nindent 4 }}
type: Opaque
stringData:
  nats-user: {{ .Values.auth.username | default "sa_admin" | quote }}
  nats-password: {{ .Values.auth.password | required "nats.auth.password es obligatorio (definirlo en values-secrets.yaml, NO versionar ese archivo)" | quote }}
