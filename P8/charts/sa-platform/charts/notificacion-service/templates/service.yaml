apiVersion: v1
kind: Service
metadata:
  name: notificacion-service
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "notificacion-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: notificacion-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 3005 }}
      targetPort: 3005
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
