# Valores por defecto del subchart (el chart padre los sobreescribe con el
# bloque que coincide con el nombre del subchart en values.yaml/values-dev/values-prod).
replicaCount: 1
image:
  repository: sa-p5/reserva-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }
probes:
  liveness: { path: /health, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3 }
  readiness: { path: /health, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 3 }
  startup: { path: /health, periodSeconds: 2, failureThreshold: 30 }
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  minAvailable: 1
serviceAccount:
  create: true
env:
  dbName: reserva_db

service:
  type: ClusterIP
