# Practica 8, Fase 5 - Entrega progresiva con Argo Rollouts.
# api-gateway (el unico punto de entrada publico del sistema) se convierte
# de Deployment a Rollout con estrategia canary: en vez de reemplazar todos
# los pods de una vez, va subiendo el porcentaje de trafico hacia la nueva
# version de forma gradual, con puntos de pausa para verificar antes de
# seguir avanzando.
#
# Es "canary basico" (sin service mesh ni Ingress con split de trafico):
# Argo Rollouts logra el porcentaje ajustando la PROPORCION de replicas
# entre el ReplicaSet viejo (stable) y el nuevo (canary), ambos detras del
# mismo Service (api-gateway), que ya reparte trafico entre sus endpoints
# por round-robin. No requiere infraestructura adicional.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "api-gateway.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/shared-config: {{ .Values.global.namespace | sha256sum }}
    spec:
      serviceAccountName: {{ include "api-gateway.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sa-p5-shared-config
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: {{ include "sa-platform.natsSecretName" . }}
          env:
            - name: PORT
              value: "3000"
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sa-platform.natsSecretName" . }}
                  key: nats-password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      # Entre pasos, Argo Rollouts espera a que los pods del canary esten
      # Ready (gracias a los probes de arriba) antes de avanzar al siguiente.
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 75
        # Pausa SIN duracion = indefinida: el rollout se queda esperando
        # aqui hasta que alguien lo promueva a mano (demuestra el punto de
        # control humano antes del 100%):
        #   kubectl argo rollouts promote api-gateway -n sa-p8
        - pause: {}
