spring.application.name=pago-service
server.port=${PORT:3004}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pago_db}
spring.datasource.username=${DB_USER:sa_admin}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Practica 6: NATS JetStream reemplaza a RabbitMQ como broker de mensajeria,
# siguiendo la recomendacion del auxiliar (en la Practica 5 se uso RabbitMQ
# como alternativa a Kafka por consumo de memoria, sin seguir la
# recomendacion original de usar NATS).
nats.url=${NATS_URL:nats://localhost:4222}
nats.user=${NATS_USER:sa_admin}
nats.password=${NATS_PASSWORD:changeme}
nats.stream.pagos=${NATS_STREAM_PAGOS:PAGOS}
nats.subject.pagos=${NATS_SUBJECT_PAGOS:eventos.pagos.confirmado}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
