spring.application.name=pago-service
server.port=${PORT:3004}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pago_db}
spring.datasource.username=${DB_USER:sa_admin}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:sa_admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:changeme}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
