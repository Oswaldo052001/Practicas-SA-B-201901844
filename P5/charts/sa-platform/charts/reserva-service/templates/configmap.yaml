apiVersion: v1
kind: ConfigMap
metadata:
  name: reserva-service-config
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "reserva-service.labels" . | nindent 4 }}
data:
  DB_NAME: {{ .Values.env.dbName | required "env.dbName es obligatorio" | quote }}
  {{- range $key, $val := .Values.env }}
  {{- if ne $key "dbName" }}
  {{ $key | upper }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
