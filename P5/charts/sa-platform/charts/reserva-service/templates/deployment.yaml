apiVersion: apps/v1
kind: Deployment
metadata:
  name: reserva-service
  namespace: {{ .Values.global.namespace | default "sa-p5" }}
  labels:
    {{- include "reserva-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: reserva-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "reserva-service.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/shared-config: {{ .Values.global.namespace | sha256sum }}
    spec:
      serviceAccountName: {{ include "reserva-service.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: reserva-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: sa-p5-shared-config
            - configMapRef:
                name: reserva-service-config
            - secretRef:
                name: {{ include "sa-platform.postgresqlSecretName" . }}
            - secretRef:
                name: {{ include "sa-platform.natsSecretName" . }}
          env:
            - name: PORT
              value: "3003"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sa-platform.postgresqlSecretName" . }}
                  key: password
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sa-platform.natsSecretName" . }}
                  key: nats-password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
