apiVersion: v2
name: sa-platform
description: Plataforma de microservicios CineTix empaquetada con Helm - Practicas 5 y 6, Software Avanzado, USAC, carne 201901844
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "15.5.20"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: nats
    version: "0.1.0"
    condition: nats.enabled

  # Subcharts locales: ya estan vendorizados fisicamente en charts/, por lo
  # que no llevan campo "repository" (no se descargan de ningun lado). Se
  # declaran de todas formas porque Helm v4 exige que toda la metadata de
  # dependencias este completa en Chart.yaml, incluso para subcharts locales.
  - name: api-gateway
    version: "0.1.0"

  - name: auth-service
    version: "0.1.0"

  - name: reserva-service
    version: "0.1.0"

  - name: pago-service
    version: "0.1.0"

  - name: notificacion-service
    version: "0.1.0"

  - name: cronjob-registro
    version: "0.1.0"

  - name: cronjob-resumen
    version: "0.1.0"
