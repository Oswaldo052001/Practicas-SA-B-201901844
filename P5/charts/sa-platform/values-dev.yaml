# values-dev.yaml
# Overrides para ambiente de desarrollo local (minikube/kind en la maquina del estudiante).
# Uso: helm install sa-platform . -f values.yaml -f values-dev.yaml -n sa-p5 --create-namespace

global:
  environment: dev
  logLevel: debug

postgresql:
  primary:
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 300m, memory: 256Mi }

rabbitmq:
  persistence:
    size: 512Mi

api-gateway:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  hpa:
    minReplicas: 1
    # Nota: el auxiliar comento en clase que en equipos locales limitados los
    # valores de HPA del enunciado (min 2 / max 5) pueden ser pesados. Para
    # dev bajamos el techo; el valor exigido por el enunciado (min 2, max 5,
    # 70%) se mantiene intacto en values-prod.yaml.
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

auth-service:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

reserva-service:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

pago-service:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 384Mi }
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

notificacion-service:
  replicaCount: 1
  image:
    tag: "dev"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

cronjob-registro:
  image:
    tag: "dev"

cronjob-resumen:
  image:
    tag: "dev"

resourceQuota:
  requestsCpu: "2"
  requestsMemory: 2Gi
  limitsCpu: "4"
  limitsMemory: 4Gi
  pods: "30"
