apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sa-p5-allow-gateway-to-microservices
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      sa.usac.edu/role: microservicio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              sa.usac.edu/role: gateway
