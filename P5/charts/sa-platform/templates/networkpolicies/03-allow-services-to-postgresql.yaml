apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sa-p5-allow-services-to-postgresql
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: sa.usac.edu/role
                operator: In
                values: ["microservicio", "cronjob"]
      ports:
        - protocol: TCP
          port: 5432
