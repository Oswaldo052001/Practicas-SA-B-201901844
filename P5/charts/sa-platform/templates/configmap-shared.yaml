apiVersion: v1
kind: ConfigMap
metadata:
  name: sa-p5-shared-config
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "sa-platform.postgresqlHost" . }}
  DB_PORT: "5432"
  DB_USER: {{ .Values.postgresql.auth.username | default "sa_admin" | quote }}
  RABBITMQ_HOST: {{ include "sa-platform.rabbitmqHost" . }}
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | default "sa_admin" | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | default "info" | quote }}
  ENVIRONMENT: {{ .Values.global.environment | default "base" | quote }}
